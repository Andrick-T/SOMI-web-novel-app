<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>SOMI — Read. Discover. Write.</title>

    <meta
      name="description"
      content="SOMI is a digital reading and publishing platform where readers discover stories and writers bring them to life, one chapter at a time."
    />

    <meta
      name="keywords"
      content="SOMI, online reading, novels, stories, books, African stories, digital books, writers, reading platform"
    />

    <meta name="author" content="SOMI" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://YOUR-SOMI-DOMAIN.com/" />

    <!-- Theme -->
    <meta name="theme-color" content="#6B4226" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SOMI" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="SOMI — Read. Discover. Write." />

    <meta
      property="og:description"
      content="Discover stories, follow your favorite writers and immerse yourself in books on SOMI."
    />

    <meta property="og:url" content="https://YOUR-SOMI-DOMAIN.com/" />

    <meta property="og:site_name" content="SOMI" />

    <meta
      property="og:image"
      content="https://YOUR-SOMI-DOMAIN.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="SOMI — Digital Reading and Publishing Platform"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="SOMI — Read. Discover. Write." />

    <meta
      name="twitter:description"
      content="Discover stories, follow writers and immerse yourself in books on SOMI."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-SOMI-DOMAIN.com/og-image.jpg"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  </head>

  <body>
    <noscript>
      SOMI requires JavaScript to provide its reading and publishing experience.
      Please enable JavaScript to continue.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
